name: Keep online server awake

# השרת החינמי ב-Render נרדם אחרי ~15 דקות בלי שימוש, ויצירת חדר אחרי זה לוקחת עד דקה.
# פינג כל 10 דקות שומר אותו ער, כך שחדר אונליין נוצר מיד.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the signaling server
        run: curl -fsS -m 90 --retry 3 --retry-delay 10 https://mi-hamitchaze-signal.onrender.com/ice || true
