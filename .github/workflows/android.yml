name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          RUN: ${{ github.run_number }}
        run: bash android/build.sh
      - name: Publish the APK as a release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create app android/out/mi-hamitchaze.apk \
            --repo "${{ github.repository }}" --latest \
            --title "אפליקציית אנדרואיד – מי המתחזה?" \
            --notes "התקנה ישירה ל-Android (בלי Google Play). האפליקציה פותחת את המשחק האונליין."
